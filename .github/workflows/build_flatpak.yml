name: Build flatpak

on:
  push:
    branches:
      - '**'
    tags:
      - 'version_*'
  workflow_dispatch:
    inputs:
      enable_sentry:
        description: 'Enable sentry'
        default: false
        type: boolean
      release_build:
        description: 'Release build'
        default: false
        type: boolean
      debug_symbols:
        description: 'Debug symbols'
        default: false
        type: boolean

jobs:
  build_flatpak:
    uses: Prusa-Development/PrusaSlicer-Actions/.github/workflows/build_flatpak.yml@nc_yoga_test_framework
    secrets: inherit
    with:
      actions_branch: nc_yoga_test_framework
      enable_sentry: ${{ inputs.enable_sentry || false }}
      release_build: ${{ inputs.release_build || startsWith(github.ref, 'refs/tags/version_') }}
      debug_symbols: ${{ inputs.debug_symbols || false }}

  ui_tests:
    needs: build_flatpak
    uses: Prusa-Development/PrusaSlicer-Testing/.github/workflows/run_fast_tests.yml@main
    secrets: inherit
    with:
      build: ${{ github.sha }}
      testing_branch: main
