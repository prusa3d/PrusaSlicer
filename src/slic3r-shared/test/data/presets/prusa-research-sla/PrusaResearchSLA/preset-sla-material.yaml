id: '*common*'
kind: sla_material
values:
  material_correction: [1.0, 1.0]
  material_print_speed: fast
variants:
- condition: printer.model == "SL1"
# all SL1 materials will use "fast" 2x18 parameters.
  id: zXCI8AZbRUe5ctk0t7p9UA
  unconditional_inherits:
  - '*sl1_fast*'
  variants:
  - condition: print.layer_height == 0.025
    id: tt9dJ+CZQWOEzNxeYPI6cw
    values:
      exposure_time: 10
      initial_exposure_time: 35
      initial_layer_height: 0.025
    # - condition: print.layer_height == 0.035
      # values:
        # exposure_time: 13
        # initial_exposure_time: 40
        # initial_layer_height: 0.035
  - condition: print.layer_height == 0.05
    id: rwniipX4S4uKlW32sRQYCA
    values:
      exposure_time: 12
      initial_exposure_time: 45
      initial_layer_height: 0.05
  - condition: print.layer_height == 0.1
    id: gr6XrPTqT8KMdcNmCFi2Kw
    values:
      exposure_time: 20
      initial_exposure_time: 45
      initial_layer_height: 0.1
- condition: printer.model == "SL1S"
  id: eFs5un4BToKTKqqFpwp9iw
  variants:
  - condition: print.layer_height == 0.025
    id: bkT0PWTzRWGJrtOK51OiGQ
    values:
      exposure_time: 1.3
      initial_exposure_time: 25
      initial_layer_height: 0.025
  - condition: print.layer_height == 0.05
    id: FhpEEty+TWqbfK1ympmA8g
    values:
      exposure_time: 1.7
      initial_exposure_time: 25
      initial_layer_height: 0.05
  - condition: print.layer_height == 0.1
    id: Odkr0xWTQSeIv1wWNEGCpA
    values:
      exposure_time: 2.6
      initial_exposure_time: 25
      initial_layer_height: 0.1
---
# "2x 18 parameters" aka material profile
# this set of many parameters will be called via unconditional inherit
id: '*material_profile*'
kind: sla_material
variants:
- condition: printer.model == "SL1"
  id: AWMWG9MlRIuDTPxXA6t39w
  variants:
# SL1
  - name: '*SL1_fast*'
    id: '*SL1_fast*'
    values:
      area_fill: 35
      delay_before_exposure: [0.0, 1.0]
      delay_after_exposure: [0.0, 0.0]
      tower_hop_height: [0.0, 0.0]
      tower_speed: layer22,layer22
      use_tilt: [1.0, 1.0]
      tilt_down_initial_speed: layer400,layer400
      tilt_down_offset_steps: [0.0, 0.0]
      tilt_down_offset_delay: [0.0, 0.0]
      tilt_down_finish_speed: layer1750,layer1500
      tilt_down_cycles: [1.0, 1.0]
      tilt_down_delay: [0.0, 0.0]
      tilt_up_initial_speed: move5120,move5120
      tilt_up_offset_steps: [400.0, 400.0]
      tilt_up_offset_delay: [0.0, 0.0]
      tilt_up_finish_speed: layer400,layer400
      tilt_up_cycles: [1.0, 1.0]
      tilt_up_delay: [0.0, 0.0]
        # For legacy slicer versions
      material_print_speed: fast
# SL1S
- condition: printer.model == "SL1S"
  id: JqOICfBLRCyN48PtOX5IdA
  variants:
  - name: '*sl1s_slow*'
    id: '*sl1s_slow*'
    values:
      area_fill: 35
      delay_before_exposure: [3.0, 3.0]
      delay_after_exposure: [0.0, 0.0]
      tower_hop_height: [0.0, 0.0]
      tower_speed: layer22,layer22
      use_tilt: [1.0, 1.0]
      tilt_down_initial_speed: layer1750,layer1750
      tilt_down_offset_steps: [0.0, 0.0]
      tilt_down_offset_delay: [0.0, 0.0]
      tilt_down_finish_speed: layer1750,layer1750
      tilt_down_cycles: [1.0, 1.0]
      tilt_down_delay: [0.0, 0.0]
      tilt_up_initial_speed: move8000,move8000
      tilt_up_offset_steps: [1200.0, 1200.0]
      tilt_up_offset_delay: [0.0, 0.0]
      tilt_up_finish_speed: layer1750,layer1750
      tilt_up_cycles: [1.0, 1.0]
      tilt_up_delay: [0.0, 0.0]
        # For legacy slicer versions
      material_print_speed: slow
  - name: '*sl1s_fast*'
    id: '*sl1s_fast*'
    values:
      area_fill: 35
      delay_before_exposure: [0.0, 1.0]
      delay_after_exposure: [0.0, 0.0]
      tower_hop_height: [0.0, 0.0]
      tower_speed: layer22,layer22
      use_tilt: [1.0, 1.0]
      tilt_down_initial_speed: layer1750,layer1750
      tilt_down_offset_steps: [0.0, 0.0]
      tilt_down_offset_delay: [0.0, 0.0]
      tilt_down_finish_speed: move8000,layer1750
      tilt_down_cycles: [1.0, 1.0]
      tilt_down_delay: [0.0, 0.0]
      tilt_up_initial_speed: move8000,move8000
      tilt_up_offset_steps: [600.0, 600.0]
      tilt_up_offset_delay: [0.0, 0.0]
      tilt_up_finish_speed: layer1750,layer1750
      tilt_up_cycles: [1.0, 1.0]
      tilt_up_delay: [0.0, 0.0]
        # For legacy slicer versions
      material_print_speed: slow
  - name: '*sl1s_hv*'
    id: '*sl1s_hv*'
    values:
      area_fill: 35
      delay_before_exposure: [3.5, 3.5]
      delay_after_exposure: [0.0, 0.0]
      tower_hop_height: [5.0, 5.0]
      tower_speed: layer2,layer2
      use_tilt: [1.0, 1.0]
      tilt_down_initial_speed: layer800,layer800
      tilt_down_offset_steps: [2200.0, 2200.0]
      tilt_down_offset_delay: [0.0, 0.0]
      tilt_down_finish_speed: layer1750,layer1750
      tilt_down_cycles: [1.0, 1.0]
      tilt_down_delay: [0.0, 0.0]
      tilt_up_initial_speed: layer1750,layer1750
      tilt_up_offset_steps: [2200.0, 2200.0]
      tilt_up_offset_delay: [0.0, 0.0]
      tilt_up_finish_speed: layer800,layer800
      tilt_up_cycles: [1.0, 1.0]
      tilt_up_delay: [0.0, 0.0]
        # For legacy slicer versions
      material_print_speed: slow
