id: SIQcB/YrR1S9QaXLihcl1Q
kind: printer
inherits:
- '*default_print_MINI*'
variants:
- condition: printer.base_model == "MINI"
  name: Original Prusa MINI
  id: 4TfihLJ8Q1+uJebMxFdmMw
  values:
    bed_shape:
    - '0x0'
    - 180x0
    - 180x180
    - '0x180'
    before_layer_gcode: |
      ;BEFORE_LAYER_CHANGE
      G92 E0.0
      ;[layer_z]
      M201 X{interpolate_table(extruded_weight_total, (0,4000), (1000,1700), (20000,1700))} Y{interpolate_table(extruded_weight_total, (0,4000), (1000,1700), (20000,1700))}
    binary_gcode: 1
    stuck_filament_detection: 0
    enable_pressure_advance_during_ramming: false
    end_gcode: |-
      {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+2, max_print_height)} F720 ; Move print head up{endif}
      G1 X170 Y170 F4200 ; park print head
      {if layer_z < max_print_height}G1 Z{z_offset+min(max_layer_z+50, max_print_height)} F720 ; Move print head further up{endif}
      G4 ; wait
      M104 S0 ; turn off temperature
      M140 S0 ; turn off heatbed
      M107 ; turn off fan
      M221 S100 ; reset flow
      M572 S0 ; reset PA
      M569 S1 X Y ; reset to stealthchop for X Y
      M84 ; disable motors
      ; max_layer_z = [max_layer_z]
    extruder_offset: ['0x0']
    gcode_flavor: marlin2
    high_current_on_filament_swap: 0
    layer_gcode: |
      ;AFTER_LAYER_CHANGE
      ;[layer_z]
      {if ! spiral_vase}M74 W[extruded_weight_total]{endif}
    machine_limits_usage: emit_to_gcode
    machine_max_acceleration_e: [5000.0, 5000.0]
    machine_max_acceleration_extruding: [4000.0, 2500.0]
    machine_max_acceleration_retracting: [1250.0, 1250.0]
    machine_max_acceleration_travel: [4000.0, 2500.0]
    machine_max_acceleration_x: [4000.0, 2500.0]
    machine_max_acceleration_y: [4000.0, 2500.0]
    machine_max_acceleration_z: [400.0, 400.0]
    machine_max_feedrate_x: [400.0, 180.0]
    machine_max_feedrate_y: [400.0, 180.0]
    machine_max_feedrate_z: [12.0, 12.0]
    machine_max_jerk_e: [10.0, 10.0]
    machine_max_jerk_x: [8.0, 8.0]
    machine_max_jerk_y: [8.0, 8.0]
    machine_max_jerk_z: [2.0, 2.0]
    machine_min_extruding_rate: [0.0, 0.0]
    machine_min_travel_rate: [0.0, 0.0]
    max_print_height: 180
    printer_technology: FFF
    remaining_times: 1
    silent_mode: 1
    single_extruder_multi_material: 0
    filament_change_time: 0
    thumbnails: [16x16/QOI, ' 220x124/QOI', ' 200x240/QOI', ' 380x285/PNG']
    use_firmware_retraction: 0
    use_relative_e_distances: 1
    use_volumetric_e: 0
    variable_layer_height: 1
    z_offset: 0
    cooling_tube_retraction: '45'
    cooling_tube_length: '20'
    parking_pos_retraction: '84'
    extra_loading_move: '-52'
    multimaterial_purging: '80'
    start_gcode: |
      M862.3 P "MINI" ; printer model check
      M862.1 P[nozzle_diameter] A{(filament_abrasive[0] ? 1 : 0)} F{(nozzle_high_flow[0] ? 1 : 0)} ; nozzle check
      M862.5 P2 ; g-code level check
      M862.6 P"Input shaper" ; FW feature check
      M115 U6.4.0+11974
      G90 ; use absolute coordinates
      M83 ; extruder relative mode
      M104 S170 ; set extruder temp for bed leveling
      M140 S[first_layer_bed_temperature] ; set bed temp
      M109 R170 ; wait for bed leveling temp
      M190 S[first_layer_bed_temperature] ; wait for bed temp
      M569 S1 X Y ; set stealthchop for X Y
      M204 T1250 ; set travel acceleration
      G28 ; home all without mesh bed level
      G29 ; mesh bed leveling 
      M104 S[first_layer_temperature] ; set extruder temp
      G92 E0

      G1 X0 Y-2 Z3 F2400

      M109 S[first_layer_temperature] ; wait for extruder temp

      ; intro line
      G1 X10 Z0.2 F1000
      G1 X70 E8 F900
      G1 X140 E10 F700
      G92 E0

      M569 S0 X Y ; set spreadcycle for X Y
      M204 T[machine_max_acceleration_travel] ; restore travel acceleration
      M572 W0.06 ; set smooth time
      M221 S95 ; set flow

