  id: lK2caIwdQQmLD7T5V7F40Q
  values:
    default_print: 0.10mm
- condition: tool.nozzle_diameter == 0.3
  id: BxXflZITSNGN4TY9nWCPqg
  values:
    default_print: 0.15mm
- condition: tool.nozzle_diameter == 0.4
  id: D5yavLwoTTCkMK/YeaMcXg
  values:
    default_print: 0.20mm
- condition: tool.nozzle_diameter == 0.5
  id: d0GROZVGTOKTFnhRO81Rsw
  values:
    default_print: 0.25mm
