kind: filament
inherits:
- '*PACF*'
- '*pacfjet_MAXVOLSPEED_PACF*'
- '*sheets_PA_pacfjet*'
name: Filament PM PA-CFJet
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
id: Filament PM PA-CFJet
values:
  filament_vendor: Filament PM
  first_layer_temperature: 245
  temperature: 245
  extrusion_multiplier: 1.02
  bridge_fan_speed: 0
  min_fan_speed: 0
  max_fan_speed: 0
  cooling: false
  fan_below_layer_time: 20
  slowdown_below_layer_time: 15
  filament_cost: 27.82
  filament_density: 1.01
  filament_spool_weight: 0
variants:
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: B4ist7JNRl+HqfzSsyWaDg
  values:
    retract_length: 1
    retract_lift: 0.2
---
