  extrusion_multiplier: 1
  filament_cost: 55.04
  filament_density: 1.2
  filament_spool_weight: 160
  first_layer_temperature: 245
  temperature: 245
  fan_below_layer_time: 9
  min_fan_speed: 30
  max_fan_speed: 50
  bridge_fan_speed: 50
