kind: filament
inherits:
- '*PLA*'
features:
  $.type: PLA
  $.tags: [abrasive, contains_carbon_fiber]
  $.properties.min_nozzle_diameter: 0.4
name: Extrudr GreenTEC Pro Carbon
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode) and tool.nozzle_diameter >= 0.4
id: Extrudr GreenTEC Pro Carbon
values:
  filament_vendor: Extrudr
  min_fan_speed: 30
  max_fan_speed: 80
  filament_cost: 62.49
  filament_density: 1.2
  filament_spool_weight: 230
  filament_abrasive: true
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  id: Ki6EqXaHR0GwS+Yo6XF8DQ
  values:
    min_fan_speed: 25
    max_fan_speed: 60
    bridge_fan_speed: 100
    overhang_fan_speed_0: 80
## MK4S/XL+
- condition: printer.model=~/(MK4S|MK3.9S|XLP)/
  id: yRsqGvEgTLCJcj0NsaibQA
  values:
    min_fan_speed: 25
    max_fan_speed: 60
    bridge_fan_speed: 100
    overhang_fan_speed_0: 80
