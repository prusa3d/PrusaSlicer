kind: filament
inherits:
- '*common*'
- '*PET*'
name: Prusament PETG
condition: printer.base_model=~/(COREONE|COREONE_INDX|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/
id: Prusament PETG
values:
  filament_cost: '29.99'
  filament_vendor: Prusa Polymers
  first_layer_temperature: 250
  temperature: 250
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 2rldOb0PR2SeBK71w4U5ZQ
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 35
    enable_dynamic_fan_speeds: 1
    bed_temperature: 85
    idle_temperature: 130
    min_fan_speed: 30
    max_fan_speed: 60
    min_print_speed: 15
    bridge_fan_speed: 60
    overhang_fan_speed_0: 60
    overhang_fan_speed_1: 0
    overhang_fan_speed_2: 0
    overhang_fan_speed_3: 0
    filament_purge_multiplier: 100%
    fan_below_layer_time: 25
    filament_infill_max_speed: 200
    start_filament_gcode: M142 S36 ; set heatbreak target temp
  variants:
  # C1 0.25
  - condition: tool.nozzle_diameter == 0.25
    id: BWv32dPKTgu43sETPOsgLg
    values:
      filament_max_volumetric_speed: 12
      slowdown_below_layer_time: 5
      pressure_advance_value: 0.18
      temperature: 245
      filament_infill_max_crossing_speed: 100
  # C1 0.3
