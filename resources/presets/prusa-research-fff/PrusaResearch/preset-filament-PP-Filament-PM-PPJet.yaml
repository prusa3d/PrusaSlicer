kind: filament
inherits:
- '*PP*'
- '*ppjet_MAXVOLSPEED_PP*'
- '*sheets_PP_ppjet*'
name: Filament PM PPJet
id: Filament PM PPJet
values:
  filament_vendor: Filament PM
  extrusion_multiplier: 1.15
  filament_cost: 33.99
  filament_spool_weight: 0
  bridge_fan_speed: 80
  disable_fan_first_layers: 3
  min_fan_speed: 20
  max_fan_speed: 40
  fan_below_layer_time: 100
variants:
- condition: printer.model=~/(COREONE|COREONEL|COREONEOAK|MK4S|MK3.9S)/
  id: N92NYoGETrqc2A1Nz3/vDA
  values:
    min_fan_speed: 20
    max_fan_speed: 30
    bridge_fan_speed: 50
    retract_length: 2.5
- condition: printer.model=~/(MK4|MK3.9|XL)/
  id: fintyawtRam53G1QL2Cu9A
  values:
    retract_length: 2.5
- condition: printer.model == "XLP"
  id: PLInoatSR2WeKLSqtPX6gQ
  values:
    retract_length: 2.5
    min_fan_speed: 20
    max_fan_speed: 30
    bridge_fan_speed: 50
- condition: printer.base_model=~/(MK3|MK3.5)/
  id: tf389joWSEmwDcGuRN/9SQ
  values:
    retract_length: 1
    deretract_speed: 25
    retract_lift: 0.4
---
kind: filament
id: '*sheets_PP_ppjet*'
variants:
# STANDARD sheet
- condition: sheet.type != "PP"
  id: 6DfWXi/cRm61388XmyE8fA
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
