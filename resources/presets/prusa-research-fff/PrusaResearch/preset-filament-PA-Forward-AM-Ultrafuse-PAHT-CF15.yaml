kind: filament
inherits:
- '*PACF*'
- '*sheets_PACF_pahtcf15*'
- '*pahtcf15_MAXVOLSPEED_PACF*'
name: Forward AM Ultrafuse PAHT-CF15
# No MINI and 0.6+
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.6 and feeder.base_model!~/.*MMU.*/
id: Forward AM Ultrafuse PAHT-CF15
values:
  filament_vendor: Forward AM
  first_layer_temperature: 270
  temperature: 270
  extrusion_multiplier: 1
  filament_density: 1.23
  filament_spool_weight: 0
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 10
  max_fan_speed: 50
  fan_always_on: false
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
variants:
- condition: printer.model=~/(COREONE|COREONEL|COREONEOAK|MK4S|MK3.9S)/
  id: t7D+PydqTty6YFU/g9R4Eg
  values:
    bridge_fan_speed: 70
    max_fan_speed: 35
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: QMktwuKnRhmyvHBbVF9wog
  values:
    retract_speed: 40
    deretract_speed: 30
    retract_length: 1.2
    retract_layer_change: false
    wipe: false
---
kind: filament
id: '*sheets_PACF_pahtcf15*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: UqkS2DaERieADdA30BwG3A
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: 6sx7tXyHRIKl9/LwUzX9Nw
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 100
---
