kind: filament
inherits:
- '*FLEX*'
name: addnorth Adamant S1
features:
  $.type: PVDF
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: addnorth Adamant S1
values:
  filament_vendor: addnorth
  bridge_fan_speed: 60
  min_fan_speed: 40
  max_fan_speed: 70
  fan_below_layer_time: 15
  slowdown_below_layer_time: 20
  extrusion_multiplier: 1
  first_layer_temperature: 245
  temperature: 250
  filament_density: 1.22
  retract_length: 1.5
  retract_lift: 0.2
  # filament_type: PVDF
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: fbdloyGlSxq27QiD1GmYVg
  values:
    bridge_fan_speed: 40
    min_fan_speed: 30
    max_fan_speed: 50
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: ryd46ijRRqelYxqqCGSKng
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8+acRFdkQXyR8ATlgQpSTg
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: KTrMvaqbSIuoKCDaJtWMzw
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: C2OzGegYTNa+W+zYJ6WdTQ
    values:
      filament_max_volumetric_speed: 9
