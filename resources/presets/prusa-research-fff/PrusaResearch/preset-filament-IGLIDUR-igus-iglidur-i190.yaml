kind: filament
inherits:
- '*PET*'
- '*igusi190_MAXVOLSPEED*'
features:
  $.type: ''
name: igus® iglidur® i190
id: igus® iglidur® i190
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.base_model=~/.*MMU.*/ and ! feeder.single_mode)
values:
  filament_cost: '94.49'
  filament_vendor: igus
  extrusion_multiplier: 0.98
  filament_density: 1.3
  first_layer_bed_temperature: 80
  bed_temperature: 80
  first_layer_temperature: 270
  temperature: 270
  filament_type: IGLIDUR
  min_fan_speed: 10
  max_fan_speed: 10
  fan_below_layer_time: 10
  bridge_fan_speed: 30
variants:
- condition: printer.model=~/(COREONE|COREONEL|COREONEOAK|MK4S|MK3.9S)/
  id: hSH4Y7h7TdW+PhMiNlXhFg
  values:
    bridge_fan_speed: 25
    overhang_fan_speed_0: 15
