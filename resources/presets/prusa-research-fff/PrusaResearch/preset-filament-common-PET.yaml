kind: filament
inherits:
- '*common*'
- '*sheets_PET_common*'
- '*chamber_PET*'
features:
  $.type: PETG
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode)
id: '*PET*'
values:
  bridge_fan_speed: 50
  cooling: 1
  disable_fan_first_layers: 3
  end_filament_gcode: ; Filament-specific end gcode
  extrusion_multiplier: 1
  fan_always_on: 1
  fan_below_layer_time: 20
  filament_colour: ''
  filament_cooling_final_speed: 2.5
  filament_cooling_initial_speed: 5
  filament_cooling_moves: 3
  filament_cost: 27.82
  filament_density: 1.27
  filament_diameter: 1.75
  filament_infill_max_crossing_speed: 0
  filament_infill_max_speed: 0
  filament_loading_speed: 10
  filament_loading_speed_start: 50
  filament_max_volumetric_speed: 8
  filament_minimal_purge_on_wipe_tower: 35
  filament_notes: ''
  filament_purge_multiplier: 100%
  filament_ramming_parameters: 250 100 42.4194 42.4194 42.4194 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
  filament_soluble: 0
  filament_spool_weight: 278
  filament_stamping_distance: 45
  filament_stamping_loading_speed: 26.5
  filament_toolchange_delay: 0
  # retract_lift: 0.2 
  travel_max_lift: 1.5
  travel_ramping_lift: 1
  travel_slope: 1
  retract_length: 0.8
  wipe: 1
  retract_before_wipe: 20%
  filament_type: PETG
  filament_unloading_speed: 60
  filament_unloading_speed_start: 60
  filament_vendor: Generic
  first_layer_temperature: 240
  full_fan_speed_layer: 5
  max_fan_speed: 50
  min_fan_speed: 30
  min_print_speed: 15
  slowdown_below_layer_time: 15
  pressure_advance: enabled
  temperature: 240
  cooling_slowdown_logic: consistent_surface
  cooling_perimeter_transition_distance: 10
variants:
## C1 INDX
- condition: printer.base_model == "COREONE_INDX"
  id: Iml/Eh7yRXKzbBVzC4KNug
  values:
    pressure_advance: automatic_calibration
    start_filament_gcode: M573 R
    first_layer_temperature: 245
    temperature: 240
    chamber_minimal_temperature: 0
    chamber_temperature: 35
    enable_dynamic_fan_speeds: 1
    bed_temperature: 90
    min_fan_speed: 30
    max_fan_speed: 60
    bridge_fan_speed: 60
    overhang_fan_speed_0: 60
    overhang_fan_speed_1: 60
    overhang_fan_speed_2: 40
    overhang_fan_speed_3: 0
    filament_purge_multiplier: 100%
    fan_below_layer_time: 25
    filament_infill_max_speed: 200
    min_print_speed: 20
    filament_multitool_ramming: 1
    filament_multitool_ramming_flow: 30
    filament_multitool_ramming_volume: 18
    filament_loading_speed: 0
    filament_loading_speed_start: 0
    filament_toolchange_delay: 0
    filament_cooling_moves: 0
    filament_cooling_initial_speed: 0
    filament_cooling_final_speed: 0
    filament_stamping_loading_speed: 0
    filament_stamping_distance: 0
    filament_unloading_speed: 0
    filament_unloading_speed_start: 0
    idle_temperature:
    retract_length_toolchange: 1.6
    retract_length: 1.6
    filament_infill_max_crossing_speed: 110
    filament_minimal_purge_on_wipe_tower: 10
