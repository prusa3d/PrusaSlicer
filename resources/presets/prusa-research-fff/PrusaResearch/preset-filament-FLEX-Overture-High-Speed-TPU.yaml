kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Overture High Speed TPU
id: Overture High Speed TPU
values:
  filament_vendor: Overture
  first_layer_temperature: 240
  temperature: 235
  bridge_fan_speed: 75
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 60
  min_print_speed: 10
  extrusion_multiplier: 1.05
  filament_density: 1.19
  filament_cost: 85
  retract_length: 1.5
