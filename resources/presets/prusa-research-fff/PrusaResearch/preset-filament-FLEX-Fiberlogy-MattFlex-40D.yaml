kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Fiberlogy MattFlex 40D
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Fiberlogy MattFlex 40D
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 230
  temperature: 230
  first_layer_bed_temperature: 60
  bed_temperature: 60
  filament_cost: 39.41
  disable_fan_first_layers: 5
  full_fan_speed_layer: 5
  extrusion_multiplier: 1.1
  filament_density: 1.16
  filament_spool_weight: 330
  bridge_fan_speed: 75
  min_fan_speed: 25
  max_fan_speed: 75
  retract_length: 2.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: tc4851eZTAuuCAtx4gwiwg
  values:
    bridge_fan_speed: 60
    min_fan_speed: 20
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: ZOWrpSowSN+p1Rucu2aBHQ
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: M59knGDdSQS40pk1Ll8e3g
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: ebmGbHzeTJ+gJ4SaqMStAQ
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: wvtJVpfXQASFFCgm+bX1eg
    values:
      filament_max_volumetric_speed: 8
