kind: filament
id: '*mmu specific*'
variants:
- condition: printer.base_model=~/(COREONE|MK4)/ and feeder.base_model == "MMU3"
  id: A++ekkDgRNOp9NnJX6EBNQ
  values:
    filament_ramming_temperature_delta: -20
    filament_ramming_initial_delay: 1.5
---
kind: filament
inherits:
- '*mmu specific*'
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
# condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and feeder.base_model!~/.*MMU.*/
id: '*common*'
values:
  pressure_advance: enabled
variants:
- condition: printer.base_model == "COREONE_INDX"
  id: tUS5QsccRf6+M1mi3/Ch/Q
  values:
    pressure_advance: automatic_calibration
---
