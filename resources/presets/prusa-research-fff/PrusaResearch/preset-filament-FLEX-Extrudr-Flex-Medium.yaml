kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Extrudr Flex Medium
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Extrudr Flex Medium
values:
  filament_vendor: Extrudr
  first_layer_temperature: 240
  temperature: 240
  filament_cost: 39.98
  disable_fan_first_layers: 1
  extrusion_multiplier: 1.1
  filament_density: 1.19
  filament_spool_weight: 230
  min_fan_speed: 70
  max_fan_speed: 90
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 5JqL9z/NTPGPg47blV7cJA
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 0OxEjVXkRWKPe4TDEa54nA
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: v/AC52npThiZWw8x0V4vMA
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: RwH9/0WCQxKyoj+D3o0Ndg
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: LTXfCqnORgSoGckT6Epmcw
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.model == "XL"
  id: feBjeGEHSPK6TM/3GBHhyA
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: IqFBI/lVSVqi5V8o5BYA2g
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: ak4TU1PpQHOs8NI6x93pMw
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: /39fPktnRaaJl3e82z+lIg
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: D2ZZtSgvT3WHvEp7FE6wcg
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## XL+
- condition: printer.model == "XLP"
  id: IG9DMQAzRpKR+a3fgF2rOA
  values:
    retract_length_toolchange: 2.5
    min_fan_speed: 40
    max_fan_speed: 60
    bridge_fan_speed: 70
  variants:
  # XL+ 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: CsmLNP4+Qw+RvivDgkY2dg
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL+ 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: fpXlfww+Sh6PMm+azljrrQ
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL+ 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: EzAtj53XT1WCh7nOO1vqSA
    values:
      filament_max_volumetric_speed: 4.5
      filament_multitool_ramming_flow: 4.5
  # XL+ 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: CC3P82OcTqW9TWiimFWtlA
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: TAQY1oVKTuyP1o53JR49ew
  values:
    bridge_fan_speed: 70
    min_fan_speed: 40
    max_fan_speed: 60
## MK3.5 and MK3 and MK2
- condition: printer.base_model=~/(MK3.5|MK3|MK2.5|MK2)/
  id: 82vZ+slWRG2838za24DbTA
  values:
    extrusion_multiplier: 1.2
    first_layer_temperature: 240
    temperature: 240
    idle_temperature: 70
    deretract_speed: 25
    retract_length: 0.4
    retract_speed: 50
    retract_lift: 0
    travel_ramping_lift: 0
    filament_max_volumetric_speed: 3
  variants:
  # MK3.5 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: eqNaRfr2SqeDQR4XZ+RQkg
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: uWnK4zXMRy2yeSZj6lomcQ
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: m4pve1MdQg6xcOJDeW/gYw
    values:
      filament_max_volumetric_speed: 3
  # MK3.5 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: +qy9hYFcTDqCpoqLOuiJow
    values:
      filament_max_volumetric_speed: 4
