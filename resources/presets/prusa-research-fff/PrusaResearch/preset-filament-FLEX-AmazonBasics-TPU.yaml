kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: AmazonBasics TPU
id: AmazonBasics TPU
values:
  filament_vendor: AmazonBasics
  filament_cost: 19.99
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 80
  max_fan_speed: 80
  bridge_fan_speed: 100
  extrusion_multiplier: 1.1
  filament_density: 1.21
  first_layer_temperature: 235
  temperature: 235
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: WkLyeDVwSQOx40HEYJC41Q
  values:
    bridge_fan_speed: 70
    min_fan_speed: 50
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 82kS4ri9ROaheXqMF3H0GA
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: OYteVI8lSIaBl5scI2tYIA
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.6
