kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Forward AM Ultrafuse TPU-95A
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Forward AM Ultrafuse TPU-95A
values:
  filament_vendor: Forward AM
  first_layer_temperature: 230
  temperature: 225
  extrusion_multiplier: 1
  filament_density: 1.14
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
  filament_spool_weight: 0
  min_fan_speed: 20
  max_fan_speed: 100
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: mZWtXFPUTiSP/1hZi0m1oQ
  values:
    min_fan_speed: 20
    max_fan_speed: 75
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: caCICmHzQWSONYdJAh1T6g
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 9PAdx9KeS7CStsTc8rtW5w
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 1KthIUzOSXSB4Tscr2qP2A
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: G34gZ3E1QGiq1onYam2fyQ
    values:
      filament_max_volumetric_speed: 5
## XL
- condition: printer.model == "XL"
