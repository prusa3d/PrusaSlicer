kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPE
name: Filatech FilaFlexible40
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Filatech FilaFlexible40
values:
  filament_vendor: Filatech
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 50
  max_fan_speed: 50
  extrusion_multiplier: 1.1
  filament_density: 1.15
  first_layer_temperature: 230
  temperature: 230
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: ir1vJHjSSruGzZhggj0jKQ
  values:
    bridge_fan_speed: 70
    min_fan_speed: 35
    max_fan_speed: 40
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: mQFFCULrQbu7xstA0vHEdQ
    values:
      filament_max_volumetric_speed: 4
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: rVuAFFUXSDaynQ0nm2mLvQ
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: KLjFAmivTF2JNCOK8rdGZQ
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: mPDynSHLRdGu54TzFJ/E1w
    values:
      filament_max_volumetric_speed: 10
## XL
- condition: printer.model == "XL"
  id: VnQYsXm/TxmLPNm443vLGw
  values:
    retract_length_toolchange: 2.5
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: u8zmJP+UQ76Nn8H+/F3BDw
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: dDPrW2gaQve7WQTAWTQh+Q
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: is2+AruWSo2hUWww6E4K3Q
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3XJPl9VkT8mh/19vKn+Jvg
    values:
      filament_max_volumetric_speed: 10
      filament_multitool_ramming_flow: 10
## XL+
- condition: printer.model == "XLP"
  id: nvQu7TsRTtGMxPRD3ZvgxA
  values:
    retract_length_toolchange: 2.5
    min_fan_speed: 35
    max_fan_speed: 40
    bridge_fan_speed: 70
  variants:
