kind: tool_print
id: '*common COREONE_INDX*'
variants:
- condition: printer.model=="COREONE_INDX"
  id: B63MAtyaT72IDauPaq2ytw
  values:
    retract_before_travel: 1.5
    retract_layer_change: 1
    retract_length_toolchange: 0
    retract_lift_above: 0
    retract_lift_below: 269
    retract_restart_extra: 0
    retract_restart_extra_toolchange: 0
    travel_ramping_lift: 1
    travel_slope: 1
    travel_max_lift: 1.5
    wipe: 0
  variants:
# 0.25    
  - condition: tool.nozzle_diameter == 0.25
    id: R+W4c9izTN6JbvB6INmBGA
    values:
      deretract_speed: 25
      max_layer_height: 0.15
      min_layer_height: 0.05
      retract_before_wipe: 80%
      retract_length: 0.8
      retract_lift: 0.15
      retract_speed: 45
# 0.3    
  - condition: tool.nozzle_diameter == 0.3
    id: +OXrbveUQgS90E6jg6Lo2g
    values:
      deretract_speed: 25
      max_layer_height: 0.22
      min_layer_height: 0.05
      retract_before_wipe: 80%
      retract_length: 0.7
      retract_lift: 0.2
      retract_speed: 45
# 0.4    
  - condition: tool.nozzle_diameter == 0.4
    id: C+GslPRzSJmmqzPWnB8tUQ
    values:
      deretract_speed: 30
      max_layer_height: 0.30
      min_layer_height: 0.07
      retract_before_wipe: 80%
      retract_length: 0.7
      retract_lift: 0.2
      retract_speed: 45
# 0.5    
  - condition: tool.nozzle_diameter == 0.5
    id: Nkx8A66fQUCgyTd5WMoeEw
    values:
      deretract_speed: 25
      max_layer_height: 0.32
      min_layer_height: 0.07
      retract_before_wipe: 80%
      retract_length: 0.7
      retract_lift: 0.2
      retract_speed: 45
      wipe: 1
# 0.6    
  - condition: tool.nozzle_diameter == 0.6
    id: euiXXok0ScCA/M996NtGhw
    values:
      deretract_speed: 25
      max_layer_height: 0.40
      min_layer_height: 0.15
      retract_before_wipe: 0%
      retract_length: 0.7
      retract_lift: 0.2
      retract_speed: 45
      wipe: 1
# 0.8    
  - condition: tool.nozzle_diameter == 0.8
    id: tz70raW5Qmien3xNMRywwA
    values:
      deretract_speed: 15
      max_layer_height: 0.6
      min_layer_height: 0.2
      retract_before_wipe: 50%
      retract_length: 0.6
      retract_lift: 0.25
      retract_speed: 25
      wipe: 1
