kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: NinjaTek NinjaFlex TPU
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: NinjaTek NinjaFlex TPU
values:
  filament_vendor: NinjaTek
  first_layer_temperature: 238
  temperature: 238
  filament_density: 1.19
  bridge_fan_speed: 75
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 60
  min_print_speed: 10
  extrusion_multiplier: 1.12
  filament_cost: 85
  retract_length: 3.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: QvkSnutTQLKie+9LGJTTlg
  values:
    bridge_fan_speed: 60
    min_fan_speed: 40
    max_fan_speed: 50
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: GXm3nlQWQ+Oyoj6WjXy2+Q
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: Vn3J36N/QC6tcFFF+WefVg
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: h+Z4zOVqRhiCNhonFdfZSw
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3z0Dzsu/R96jZH2elo0x4w
    values:
      filament_max_volumetric_speed: 8
