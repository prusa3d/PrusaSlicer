    overhang_fan_speed_0: 20
    overhang_fan_speed_1: 15
    overhang_fan_speed_2: 0
    overhang_fan_speed_3: 0
    fan_below_layer_time: 35
    filament_infill_max_speed: 200
    start_filament_gcode: M573 R
    retract_length: 1
    travel_max_lift: 1
