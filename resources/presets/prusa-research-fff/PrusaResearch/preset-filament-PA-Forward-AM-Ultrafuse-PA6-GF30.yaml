kind: filament
inherits:
- '*PACF*'
- '*sheets_PACF_pa6gf30*'
- '*pa6gf30_MAXVOLSPEED_PACF*'
name: Forward AM Ultrafuse PA6 GF30
# No MINI and 0.6+
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.6 and feeder.base_model!~/.*MMU.*/
id: Forward AM Ultrafuse PA6 GF30
values:
  filament_vendor: Forward AM
  first_layer_temperature: 270
  temperature: 270
  extrusion_multiplier: 1
  filament_density: 1.17
  filament_spool_weight: 0
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 10
  max_fan_speed: 50
  fan_always_on: false
  fan_below_layer_time: 30
  slowdown_below_layer_time: 15
variants:
- condition: printer.base_model == "COREONE"
  id: GyPtyCfoR7WiWA8Tg8Eu5Q
  values:
    bridge_fan_speed: 70
    max_fan_speed: 35
    filament_shrinkage_compensation_xy: 0%
    filament_shrinkage_compensation_z: 0.24%
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: 4cbmM1v3SnOlhzSUOifdRA
  values:
    bridge_fan_speed: 70
    max_fan_speed: 35
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: FxwUbKWhT+6RpyHE2QBTLQ
  values:
    retract_speed: 40
    deretract_speed: 30
    retract_length: 1.2
    retract_layer_change: false
    wipe: false
---
kind: filament
id: '*sheets_PACF_pa6gf30*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: AstKMieuSUibZG9q5KKe6A
  values:
    first_layer_bed_temperature: 100
    bed_temperature: 100
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: wNAsHdn6S1CHuIsqUmNxEA
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 100
---
