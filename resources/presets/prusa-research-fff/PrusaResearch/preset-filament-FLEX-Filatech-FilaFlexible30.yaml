kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPE
name: Filatech FilaFlexible30
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Filatech FilaFlexible30
values:
  filament_vendor: Filatech
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 50
  max_fan_speed: 50
  extrusion_multiplier: 1.1
  filament_density: 1.15
  first_layer_temperature: 230
  temperature: 225
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: IbecVk+GTjulyEvsvubyrQ
  values:
    bridge_fan_speed: 70
    min_fan_speed: 35
    max_fan_speed: 40
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: YfqikkikTVGhghhapMTAgA
    values:
      filament_max_volumetric_speed: 3.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: xgl1Y1Y3Qx25aGSMGhSIeA
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: j84tRJd2Sae1nyl/5DnLIA
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: aNoqXSUtRvyJQPF89I2Oww
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.model == "XL"
  id: R/Q2oqglTX6KBBT20E3UPA
  values:
    filament_multitool_ramming_flow: 3.5
    retract_length_toolchange: 3
  variants:
  # XL 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: noPU4hi+TKexoGScz4LP9g
    values:
      filament_max_volumetric_speed: 3.5
      filament_multitool_ramming_flow: 3.5
  # XL 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: lHSYP8mNRL69cwoRCNoElw
    values:
      filament_max_volumetric_speed: 4
      filament_multitool_ramming_flow: 4
  # XL 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 8/mF7MkLSBGaLtZHCymkMw
    values:
      filament_max_volumetric_speed: 5
      filament_multitool_ramming_flow: 5
  # XL 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: oBgc4eZzRQ++GhR5QwqsRw
    values:
      filament_max_volumetric_speed: 8
      filament_multitool_ramming_flow: 8
## XL+
- condition: printer.model == "XLP"
  id: MRg2Zb10TV682mBXz4xijw
  values:
    filament_multitool_ramming_flow: 3.5
    retract_length_toolchange: 3
    min_fan_speed: 35
    max_fan_speed: 40
    bridge_fan_speed: 70
  variants:
