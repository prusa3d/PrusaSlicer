kind: filament
inherits:
- '*FLEX*'
features:
  $.type: OBC
name: addnorth OBC Polyethylene
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: addnorth OBC Polyethylene
values:
  filament_vendor: addnorth
  first_layer_bed_temperature: 100
  bed_temperature: 100
  first_layer_temperature: 195
  temperature: 200
  extrusion_multiplier: 1
  bridge_fan_speed: 40
  min_fan_speed: 20
  max_fan_speed: 30
  fan_below_layer_time: 15
  min_print_speed: 20
  slowdown_below_layer_time: 5
  retract_length: 1.5
  # filament_type: OBC
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: CrGGk6KLSOqwDET4h64PuA
  values:
    bridge_fan_speed: 25
    min_fan_speed: 15
    max_fan_speed: 20
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: euN1xyzHTcOOka2Ljj8m+g
    values:
      filament_max_volumetric_speed: 4
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: CmF27ulVS/yELHv3lfJizw
    values:
      filament_max_volumetric_speed: 4
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: F+01NySxSzKvmK9GoK91Fg
    values:
      filament_max_volumetric_speed: 6
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: PmduK3xxSQejRpMXEmb3NA
    values:
      filament_max_volumetric_speed: 10
## XL
