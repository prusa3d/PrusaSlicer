kind: filament
inherits:
- '*PP*'
- '*sheets_PP_ultrafusepp*'
- '*ultrafusepp_MAXVOLSPEED_PP*'
name: Forward AM Ultrafuse PP
id: Forward AM Ultrafuse PP
values:
  filament_vendor: Forward AM
  first_layer_temperature: 240
  temperature: 240
  extrusion_multiplier: 1
  filament_density: 0.91
  bridge_fan_speed: 100
  disable_fan_first_layers: 1
  full_fan_speed_layer: 3
  min_fan_speed: 100
  max_fan_speed: 100
  fan_always_on: false
  fan_below_layer_time: 60
  min_print_speed: 10
  wipe:
  retract_lift:
variants:
- condition: printer.model=~/(COREONE|COREONEL|COREONEOAK|MK4S|MK3.9S|XLP)/
  id: zwglRC0PSIe5rdT9m9sv2w
  values:
    min_fan_speed: 70
    max_fan_speed: 70
    bridge_fan_speed: 70
---
kind: filament
id: '*sheets_PP_ultrafusepp*'
variants:
# STANDARD sheet
- condition: sheet.type != "PP"
  id: XWt+B0wfR+m36ilRUdSb2Q
  values:
    first_layer_bed_temperature: 80
    bed_temperature: 70
  # variants:
  # - condition: printer.model == "MINI"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 105
      # bed_temperature: 105
# PP sheet
- condition: sheet.type == "PP"
  id: ih3CuBw5S360Soa3lhNHDA
  values:
    first_layer_bed_temperature: 80
    bed_temperature: 70
---
