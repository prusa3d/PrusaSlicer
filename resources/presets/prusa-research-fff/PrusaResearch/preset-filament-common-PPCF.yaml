kind: filament
inherits:
- '*common*'
- '*sheets_PPCF_common*'
- '*chamber_PP*'
- '*shrinkage_PPCF*'
features:
  $.type: PP
  $.tags: [abrasive, contains_carbon_fiber]
  $.properties.min_nozzle_diameter: 0.4
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
id: '*PPCF*'
values:
  filament_abrasive: true
  extrusion_multiplier: 1.09
  bridge_fan_speed: 100
  cooling: false
  cooling_perimeter_transition_distance: 10
  cooling_slowdown_logic: consistent_surface
  disable_fan_first_layers: 3
  enable_dynamic_fan_speeds: 0
  end_filament_gcode: ; Filament-specific end gcode
  fan_always_on: 0
  fan_below_layer_time: 10
  filament_cooling_final_speed: 2.5
  filament_cooling_initial_speed: 5
  filament_cooling_moves: 3
  filament_cost: 121.2
  filament_density: 0.91
  filament_diameter: 1.75
  filament_infill_max_speed: 0
  filament_loading_speed: 10
  filament_loading_speed_start: 50
  filament_max_volumetric_speed: 6
  filament_minimal_purge_on_wipe_tower: 35
  filament_multitool_ramming: 0
  filament_multitool_ramming_flow: 10
  filament_multitool_ramming_volume: 10
  filament_purge_multiplier: 100%
  filament_ramming_parameters: 250 100 42.4194 42.4194 42.4194 42.4194 42.4194| 0.05 42.4387 0.45 42.4387 0.95 42.4387 1.45 42.4387 1.95 42.4387 2.45 42.4387 2.95 42.4387 3.45 42.4387 3.95 42.4387 4.45 42.4387 4.95 42.4387
  retract_lift: 0.2
  filament_soluble: 0
  filament_spool_weight: 278
  filament_stamping_distance: 45
  filament_stamping_loading_speed: 26.5
  filament_toolchange_delay: 0
  filament_type: PP
  filament_unloading_speed: 60
  filament_unloading_speed_start: 60
  filament_vendor: Generic
  full_fan_speed_layer: 5
  idle_temperature: 150
  max_fan_speed: 0
  min_fan_speed: 0
  min_print_speed: 15
  overhang_fan_speed_0: 0
  overhang_fan_speed_1: 0
  overhang_fan_speed_2: 0
  overhang_fan_speed_3: 0
  slowdown_below_layer_time: 15
  start_filament_gcode: M142 S45 ; set heatbreak target temp
  first_layer_temperature: 270
  temperature: 270
  pressure_advance: enabled
  travel_max_lift: 0.6
  travel_ramping_lift: true
  travel_slope: 1
