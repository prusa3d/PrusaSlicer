kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Filatech TPU
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Filatech TPU
values:
  filament_vendor: Filatech
  filament_cost: 84.68
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 80
  max_fan_speed: 80
  fan_below_layer_time: 60
  extrusion_multiplier: 1.1
  filament_density: 1.2
  first_layer_temperature: 235
  temperature: 235
  retract_length: 2.2
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: /bpAs3RoSeqNkJ+2q/Vrag
  values:
    bridge_fan_speed: 70
    min_fan_speed: 30
    max_fan_speed: 60
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: EO5zAhteQmmWA422MilrFQ
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: xjrqqJ+yQnmLMS5ZsacBgQ
    values:
      filament_max_volumetric_speed: 4.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: jrFzAySHQ6GWfrZZSp+aig
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: hQPRnG0VRtaDMfNIiVVdSQ
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.model == "XL"
  id: 08UD1nAiRrCUZ6E3bc5K9Q
  values:
    retract_length_toolchange: 2.2
