variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: ZuApNZkKR6uvREmC7fqEgw
  values:
    first_layer_bed_temperature: 85
    bed_temperature: 85
  variants:
  - condition: printer.base_model == "XL"
    id: OC+eJV6KQ+a8YoxjpeuM7A
    values:
      first_layer_bed_temperature: 80
      bed_temperature: 80
  - condition: printer.base_model=~/(MK3|MK2)/
    id: Ny2rb7ZPQyq9ojL4Au+UdQ
    values:
      bed_temperature: 90
# COLD sheet
- condition: sheet.type == "cold"
  id: olYpr/BqRr+bxXoHfHXv/A
