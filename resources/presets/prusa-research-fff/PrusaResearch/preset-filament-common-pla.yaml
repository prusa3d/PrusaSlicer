kind: filament
inherits:
- '*common*'
- '*sheets_PLA_common*'
- '*chamber_PLA*'
features:
  $.type: PLA
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode)
id: '*PLA*'
values:
  bridge_fan_speed: 100
  cooling: 1
  disable_fan_first_layers: 1
  end_filament_gcode: ; Filament-specific end gcode
  extrusion_multiplier: 1
  fan_always_on: 1
  fan_below_layer_time: 100
  filament_colour: ''
  filament_cooling_final_speed: 3.5
  filament_cooling_initial_speed: 10
  filament_cooling_moves: 2
  filament_cost: 27.99
  filament_density: 1.24
  filament_diameter: 1.75
  filament_infill_max_crossing_speed: 0
  filament_infill_max_speed: 0
  filament_loading_speed: 10
  filament_loading_speed_start: 50
  filament_max_volumetric_speed: 15
  filament_minimal_purge_on_wipe_tower: 15
  filament_notes: ''
  filament_purge_multiplier: 100%
  filament_ramming_parameters: 250 100 40.1613 40.3548 40.4516 40.3548 40.2581| 0.05 40.1483 0.45 40.3419 0.95 40.3419 1.45 40.3419 1.95 40.3419 2.45 40.3419 2.95 40.3419 3.45 40.3419 3.95 40.3419 4.45 40.3419 4.95 40.3419
  filament_soluble: 0
  filament_spool_weight: 278
  filament_stamping_distance: 45
  filament_stamping_loading_speed: 29
  filament_toolchange_delay: 0
  travel_max_lift: 0.6
  travel_ramping_lift: 1
  travel_slope: 1
  filament_type: PLA
  filament_unloading_speed: 40
  filament_unloading_speed_start: 30
  filament_vendor: Prusa Polymers
  first_layer_temperature: 215
  full_fan_speed_layer: 3
  max_fan_speed: 100
  min_fan_speed: 100
  min_print_speed: 15
  slowdown_below_layer_time: 12
  temperature: 215
  cooling_slowdown_logic: consistent_surface
  cooling_perimeter_transition_distance: 10
  pressure_advance: enabled
variants:
