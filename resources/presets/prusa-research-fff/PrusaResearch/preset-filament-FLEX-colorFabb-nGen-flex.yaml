kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: colorFabb nGen flex
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: colorFabb nGen flex
values:
  filament_vendor: colorFabb
  filament_cost: 58.3
  min_fan_speed: 20
  max_fan_speed: 35
  bridge_fan_speed: 40
  fan_always_on: false
  fan_below_layer_time: 10
  slowdown_below_layer_time: 15
  extrusion_multiplier: 1
  filament_density: 1
  first_layer_temperature: 260
  temperature: 260
  first_layer_bed_temperature: 85
  bed_temperature: 85
  retract_length: 2.5
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: LmaEw9dSSSeEQHWH3gFvjA
  values:
    bridge_fan_speed: 30
    min_fan_speed: 20
    max_fan_speed: 20
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: yqsyMb/LS7eHGULsfMFASg
    values:
      filament_max_volumetric_speed: 5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: ICIs9goBTp6XmPYs+T9fBg
    values:
      filament_max_volumetric_speed: 5
  # C1 0.6
