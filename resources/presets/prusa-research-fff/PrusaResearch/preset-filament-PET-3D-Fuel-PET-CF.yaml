kind: filament
id: '*sheets_PET_3dfuelpetcf*'
variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: YD9XD7jkT0mAMX+eUTW8iQ
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 90
# COLD sheet
- condition: sheet.type == "cold"
  id: rkwTlGMXQym168x80i0S8g
  values:
    first_layer_bed_temperature: 70
    bed_temperature: 70
