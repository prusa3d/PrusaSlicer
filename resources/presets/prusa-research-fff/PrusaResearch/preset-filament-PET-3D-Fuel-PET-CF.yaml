kind: filament
inherits:
- '*PETCF*'
- '*sheets_PET_3dfuelpetcf*'
name: 3D-Fuel PET-CF
# XL/C1/MK4 family 0.6 nozzle
condition: printer.base_model=~/(COREONE|MK4|XL|)/ and tool.nozzle_diameter > 0.4 and feeder.base_model!~/.*MMU.*/
id: 3D-Fuel PET-CF
values:
  filament_vendor: 3D-Fuel
  filament_type: PET
  first_layer_bed_temperature: 285
  temperature: 285
  extrusion_multiplier: 1.03
  filament_density: 1.23
  filament_spool_weight: 0
  bridge_fan_speed: 30
  disable_fan_first_layers: 1
  enable_dynamic_fan_speeds: true
  full_fan_speed_layer: 3
  min_fan_speed: 12
  max_fan_speed: 20
  fan_always_on: false
  fan_below_layer_time: 20
  overhang_fan_speed_0: 30
  overhang_fan_speed_1: 20
  overhang_fan_speed_2: 0
  overhang_fan_speed_3: 0
  filament_abrasive: true
variants:
- condition: printer.base_model == "COREONE"
  id: gi7+QWJmTPqm/GVJLLwUcQ
  values:
    bridge_fan_speed: 30
    min_fan_speed: 10
    max_fan_speed: 20
    chamber_temperature: 45
  variants:
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: dClfSfCsQiir02I0ivkcTg
    values:
      fan_below_layer_time: 20
      filament_max_volumetric_speed: 9
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      id: HR1N1DGHRYmR8ZI34rwbfQ
      values:
        filament_max_volumetric_speed: 9
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: fHz3QAWlTheyxhO0iJPb0g
    values:
      fan_below_layer_time: 20
      filament_max_volumetric_speed: 10
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      id: 2LKmy56ETV+wUiYhomltHw
      values:
        filament_max_volumetric_speed: 10
  # END
  - name: '*quit*'
# XL/MK4
    id: tvO89uaPTf+L0Q57YKvyzQ
- condition: printer.model=~/(XL|MK4|MK3.9)/
  id: fseTS3pLQpa1mE6oFjpX/Q
  values:
    bridge_fan_speed: 35
    min_fan_speed: 10
    max_fan_speed: 25
  variants:
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: QCplTMFXQPKHnM1g8+8Beg
    values:
      filament_max_volumetric_speed: 9
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      id: FB/eKk8RQd2vhqEplGHBwg
      values:
        filament_max_volumetric_speed: 9
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 6hZrZWAzQUugxspFWuWuZg
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      id: 2pcT6o8LSIi059Z0SG7EWw
      values:
        filament_max_volumetric_speed: 10
  # END
  - name: '*quit*'
    id: 39eF/SoBQ+On3P1jVDeRCw
- condition: printer.model=~/(MK4S|MK3.9S)/
  id: wjp2KxosSpqMgYiiw26Kzw
  values:
    bridge_fan_speed: 35
    min_fan_speed: 10
    max_fan_speed: 25
  variants:
  # 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 8I9y/xddTAe84kaNuYTBRA
    values:
      filament_max_volumetric_speed: 9
    variants:
    # HF0.5
    - condition: tool.nozzle_high_flow
      id: cwIhf+0WR7O7ESxOoG1w2Q
      values:
        filament_max_volumetric_speed: 9
  # 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: ZW8jtd2SQY6mWwSR0wlKWg
    values:
      filament_max_volumetric_speed: 10
    variants:
    # HF0.6
    - condition: tool.nozzle_high_flow
      id: 2iVzarg/S/OrBSBPr9b/JQ
      values:
        filament_max_volumetric_speed: 10
  # END
