kind: filament
inherits:
- '*PPCF*'
name: Tectonic-3D KRATIR PP CF
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
id: Tectonic-3D KRATIR PP CF
values:
  filament_vendor: Tectonic-3D
  first_layer_temperature: 250
  temperature: 250
  extrusion_multiplier: 1
  filament_cost: 100
  filament_density: 1.07
  bridge_fan_speed: 20
  min_fan_speed: 0
  max_fan_speed: 0
  cooling: false
  fan_always_on: false
  chamber_minimal_temperature: 0
  chamber_temperature: 0
  # Bed temperature global
  first_layer_bed_temperature: 60
  bed_temperature: 60

