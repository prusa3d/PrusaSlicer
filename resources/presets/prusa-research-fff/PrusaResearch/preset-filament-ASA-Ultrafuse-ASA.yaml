kind: filament
inherits:
- '*ASA*'
name: Forward AM Ultrafuse ASA
id: Forward AM Ultrafuse ASA
values:
  filament_vendor: Forward AM
  filament_cost: 30
  extrusion_multiplier: 0.98
  filament_density: 1.07
  filament_spool_weight: 330
  fan_always_on: 0
  cooling: 1
  min_fan_speed: 15
  max_fan_speed: 40
  bridge_fan_speed: 100
