kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPE
name: Filament PM TPE88 RubberJet
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Filament PM TPE88 RubberJet
values:
  filament_vendor: Filament PM
  filament_diameter: 1.68
  filament_cost: 33.99
  disable_fan_first_layers: 3
  extrusion_multiplier: 1.14
  filament_density: 0.89
  filament_spool_weight: 0
  bridge_fan_speed: 30
  min_fan_speed: 10
  max_fan_speed: 10
  first_layer_temperature: 240
  temperature: 240
  first_layer_bed_temperature: 0
  bed_temperature: 0
  fan_always_on: true
  cooling: false
  # filament_type: TPE
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: 6swT6eWVTkO3mxF/eMDCpg
  values:
    bridge_fan_speed: 20
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: RdsNikqJQtuP/AxCBK0Dfg
    values:
      filament_max_volumetric_speed: 3
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: v5wCZ/ITR9qIwYPlMA2HIw
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: 97ZnBPU5TkWtNRKxqBV7VQ
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
