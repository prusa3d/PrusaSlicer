kind: filament
name: Prusament TPU 95A
id: Prusament TPU 95A
inherits:
- '*FLEX*'
features:
  $.type: TPU
condition: printer.base_model=~/(COREONE|MK4|XL)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
values:
  first_layer_bed_temperature: 65
  bed_temperature: 65
  filament_cost: 77.98
  filament_density: 1.23
  filament_spool_weight: 278
  filament_vendor: Prusa Polymers
  bridge_fan_speed: 55
  disable_fan_first_layers: 4
  full_fan_speed_layer: 6
  min_fan_speed: 55
  max_fan_speed: 55
  cooling: false
  slowdown_below_layer_time: 15
  retract_speed:
  deretract_speed:
  retract_before_travel:
  retract_layer_change:
  retract_length:
  wipe:
  travel_ramping_lift: false
  filament_notes: MBL160
  extrusion_multiplier: 1.1
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: HtYpfj8KQDyiEX16FJxvWQ
  values:
    chamber_minimal_temperature: 0
    chamber_temperature: 30
    bridge_fan_speed: 65
    min_fan_speed: 65
    max_fan_speed: 65
    idle_temperature: 150
    first_layer_temperature: 225
    temperature: 225
    extrusion_multiplier: 1.09
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: x1nV+ea2Q7aPELodQac26w
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: oCqjdbKwQzOjODV/sOr5jQ
    values:
      filament_max_volumetric_speed: 3
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: B0bzRVeVQAqE3C12yQUq3g
    values:
      filament_max_volumetric_speed: 4
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: W7cPokb1QHy3/rWKeOSkGw
    values:
      filament_max_volumetric_speed: 8
