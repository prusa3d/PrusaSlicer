kind: filament
inherits:
- '*PACF*'
- '*sheets_PACF_fiberlogypagf*'
- '*fiberlogypagf_MAXVOLSPEED_PACF*'
name: Fiberlogy Nylon PA12+GF15
# No MINI
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and feeder.base_model!~/.*MMU.*/
id: Fiberlogy Nylon PA12+GF15
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 265
  temperature: 265
  extrusion_multiplier: 0.97
  filament_cost: 87.5
  filament_density: 1.13
  filament_spool_weight: 330
  min_fan_speed: 10
  max_fan_speed: 15
  disable_fan_first_layers: 5
  fan_below_layer_time: 20
---
kind: filament
id: '*sheets_PACF_fiberlogypagf*'
variants:
# STANDARD sheet
- condition: sheet.type != "PA"
  id: /uEJ0CqwQs2nBEEKL4PTqQ
  values:
    first_layer_bed_temperature: 105
    bed_temperature: 110
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 100
      # bed_temperature: 100
# PA sheet
- condition: sheet.type == "PA"
  id: HfM39yqiRJOV9UFuGNbKrw
  values:
    first_layer_bed_temperature: 90
    bed_temperature: 110
---
