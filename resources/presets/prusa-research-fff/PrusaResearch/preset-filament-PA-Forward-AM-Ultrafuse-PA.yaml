kind: filament
inherits:
- '*PA*'
- '*ultrafusepa_MAXVOLSPEED_PA*'
name: Forward AM Ultrafuse PA
id: Forward AM Ultrafuse PA
values:
  filament_vendor: Forward AM
  first_layer_temperature: 240
  temperature: 240
  filament_density: 1.12
  filament_spool_weight: 0
  bridge_fan_speed: 0
  min_fan_speed: 0
  max_fan_speed: 0
  fan_always_on: false
  retract_layer_change: false
# bed temperature global
  first_layer_bed_temperature: 80
  bed_temperature: 70
variants:
- condition: printer.base_model=~/(MK2|MK3|MK3.5)/
  id: 1YMUsdQ6Sr2eL1EglubJRQ
  values:
    retract_length: 1
