kind: filament
inherits:
- '*PET*'
- '*igusi150_MAXVOLSPEED*'
features:
  $.type: ''
name: igus® iglidur® i150
id: igus® iglidur® i150
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.base_model=~/.*MMU.*/ and ! feeder.single_mode)
values:
  filament_cost: '66.08'
  filament_vendor: igus
  extrusion_multiplier: 0.99
  filament_density: 1.3
  first_layer_bed_temperature: 80
  bed_temperature: 80
  first_layer_temperature: 230
  temperature: 230
  filament_type: IGLIDUR
  max_fan_speed: 80
variants:
- condition: printer.model=~/(COREONE|COREONEL|COREONEOAK|MK4S|MK3.9S)/
  id: NJuJ3DAuRRmWuMzQ5UpPng
  values:
    min_fan_speed: 25
    max_fan_speed: 65
    bridge_fan_speed: 40
    overhang_fan_speed_0: 65
  variants:
  - condition: tool.nozzle_diameter == 0.8
    id: IiC08up+RNacjZ437RRVyQ
    values:
      min_fan_speed: 30
      bridge_fan_speed: 50
