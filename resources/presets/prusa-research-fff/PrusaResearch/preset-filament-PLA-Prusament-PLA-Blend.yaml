kind: filament
inherits:
- '*PLASILK*'
name: Prusament PLA Blend
id: Prusament PLA Blend
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI|COREONE_INDX)/ and ! ((printer.supports_mmu2s or printer.supports_mmu3_8bit) and ! feeder.single_mode)
features:
  $.brand.uuid: ae5ff34e-298e-50c9-8f77-92a97fb30b09
  $.brand.slug: prusament
  $.tags: [blend]
values:
  filament_cost: '27.99'
  filament_vendor: Prusa Polymers
variants:
  ## C1 INDX
- condition: printer.base_model == "COREONE_INDX"
  id: kr6qwFS2QkSa1o8VlGYCzQ
  values:
    first_layer_temperature: 230
    temperature: 225
  variants:
  # C1 INDX 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: 0lsyKurlQ4SPU90eHzrSAQ
    values:
      filament_max_volumetric_speed: 12.5
      slowdown_below_layer_time: 12
      pressure_advance_value: 0.032
      filament_infill_max_crossing_speed: 130
    variants:
    # C1 INDX HF0.4
    - condition: tool.nozzle_high_flow
      id: jHUNG0hxQ3CCIYv/UO+GVw
      values:
        filament_max_volumetric_speed: 12.5
