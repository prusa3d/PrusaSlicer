kind: filament
inherits:
- '*PLA*'
- '*sheets_PLA_GreenyHT*'
- '*GreenyHT_MAXVOLSPEED*'
name: Spectrum GreenyHT
id: Spectrum GreenyHT
values:
  filament_vendor: Spectrum
  disable_fan_first_layers: 3
  min_fan_speed: 30
  bridge_fan_speed: 50
  fan_below_layer_time: 20
  filament_density: 1.54
  first_layer_temperature: 205
  temperature: 205
variants:
 ## C1
- condition: printer.base_model == "COREONE"
  id: jnpwq/uASQO2B3CA5tvwfA
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overhang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK4S
- condition: printer.model=~/(MK4S|MK3.9S|XLP)/
  id: YNyD7eEgRv+vqwcCiRAvmw
  values:
    min_fan_speed: 25
    max_fan_speed: 80
    bridge_fan_speed: 45
    overhang_fan_speed_0: 80
    first_layer_temperature: 215
    temperature: 215
## MK3.5
- condition: printer.base_model == "MK3.5"
  id: +WMoJ2IrSWau+OodEJv9Qw
  values:
    first_layer_temperature: 210
    temperature: 210
## MINI
- condition: printer.base_model == "MINI"
  id: 6ferzHDLTbCM4WyCoGLyvg
  values:
    first_layer_temperature: 210
    temperature: 210
---
kind: filament
id: '*sheets_PLA_GreenyHT*'
variants:
# STANDARD sheet
- condition: sheet.type != "cold"
  id: mpWZmUnTTSyFCHs3sfvK4Q
  values:
    first_layer_bed_temperature: 45
    bed_temperature: 45
  # variants:
  # - condition: printer.base_model == "XL"
    # values:
      # first_layer_bed_temperature: 60
      # bed_temperature: 60
# COLD sheet
- condition: sheet.type == "cold"
  id: 182oEmYIQ5uOLKiUp//bsg
  values:
    first_layer_bed_temperature: 30
    bed_temperature: 30
