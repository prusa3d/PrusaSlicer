kind: filament
inherits:
- '*common*'
- '*PET*'
- '*chamber_PET*'
features:
  $.type: CPE
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5|MINI)/ and ! (feeder.model=~/(MMU2S|MMU3_8bit)/ and ! feeder.single_mode)
