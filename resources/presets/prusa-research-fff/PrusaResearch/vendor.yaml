kind: feeder
technology: FFF
id: mmu3_32b
name: MMU3
condition: printer.base_model=~/(COREONE|MK4)/ #and (tool.nozzle_diameter == 0.4 or tool.nozzle_diameter == 0.6) and ! (tool.nozzle_diameter == 0.6 and tool.nozzle_high_flow)
feeder_type: mmu
model:
  base_model: MMU3
  model: MMU3_32bit
slot_count: 5
---
kind: feeder
technology: FFF
id: mmu3_8b
