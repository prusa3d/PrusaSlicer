kind: tool
technology: FFF
id: '0.4'
name: '0.4'
condition: printer.supports_non_high_flow_nozzle and (feeder.base_model!~/.*MMU.*/ or feeder.single_mode) and printer.supports_04_nozzle or (feeder.base_model=~/.*MMU.*/ and ! feeder.single_mode and printer.supports_mmu_04_nozzle) and printer.base_model!="COREONE_INDX"
features:
  nozzle_diameter:
    default: 0.4
