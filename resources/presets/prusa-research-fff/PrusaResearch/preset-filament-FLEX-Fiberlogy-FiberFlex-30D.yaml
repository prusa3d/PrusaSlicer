kind: filament
inherits:
- '*FLEX*'
features:
  $.type: TPU
name: Fiberlogy FiberFlex 30D
condition: printer.base_model=~/(COREONE|MK4|MK3.5|MK2|XL|MK3|MK2.5)/ and tool.nozzle_diameter >= 0.4 and (feeder.base_model!~/.*MMU.*/ or (feeder.base_model=~/.*MMU.*/ and feeder.single_mode))
id: Fiberlogy FiberFlex 30D
values:
  filament_vendor: Fiberlogy
  first_layer_temperature: 220
  temperature: 220
  first_layer_bed_temperature: 55
  bed_temperature: 55
  filament_cost: 39.41
  disable_fan_first_layers: 5
  full_fan_speed_layer: 5
  extrusion_multiplier: 1.1
  filament_density: 1.07
  filament_spool_weight: 330
  bridge_fan_speed: 75
  min_fan_speed: 25
  retract_length: 3
## C1
variants:
- condition: printer.base_model == "COREONE"
  id: qJ89bc52SFi2FHAfuwCy8Q
  values:
    bridge_fan_speed: 50
    min_fan_speed: 20
    max_fan_speed: 45
  variants:
  # C1 0.4
  - condition: tool.nozzle_diameter == 0.4
    id: jV/N4L5mQNeJvdWCsxSZMg
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.5
  - condition: tool.nozzle_diameter == 0.5
    id: 5K4ehEWzR4auHaeubVTqDQ
    values:
      filament_max_volumetric_speed: 2.5
  # C1 0.6
  - condition: tool.nozzle_diameter == 0.6
    id: Yq+HKJlxTI6PjB5+ekXw+g
    values:
      filament_max_volumetric_speed: 5
  # C1 0.8
  - condition: tool.nozzle_diameter == 0.8
    id: 3qPGxY8NTSuRCCoZ8Jmd+Q
    values:
      filament_max_volumetric_speed: 8
## XL
- condition: printer.model == "XL"
