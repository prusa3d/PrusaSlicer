kind: filament
inherits:
- '*ASA*'
name: Print With Smile ASA
id: Print With Smile ASA
values:
  filament_vendor: Print With Smile
  filament_cost: 30
  filament_density: 1.07
  filament_spool_weight: 330
  fan_always_on: 0
  cooling: 1
  min_fan_speed: 25
