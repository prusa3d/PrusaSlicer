id: Prusament Resin Model Prusa Pro Green
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#29B2B2'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: WJxGJIbdQECZJJwPtluIKQ
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    delay_before_exposure: [1, 10]
    tilt_down_initial_speed: [layer1750, layer1750]
    tilt_down_offset_steps: [0, 1200]
    tilt_down_finish_speed: [move8000, move5120]
    tilt_up_initial_speed: [move8000, move8000]
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: [layer1750, layer1750]
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    name: Prusament Resin Model Prusa Pro Green @SL1S 0.025
    id: ccrRMSklQGmEzd8elF1FdQ
    values:
      exposure_time: 2.2
      initial_exposure_time: 5
# 0.05
  - condition: print.layer_height == 0.05
    name: Prusament Resin Model Prusa Pro Green @SL1S 0.05
    id: gkcsW3szQnWjEXQiMBXeKw
    values:
      exposure_time: 2.4
      initial_exposure_time: 6
# 0.1
  - condition: print.layer_height == 0.1
    name: Prusament Resin Model Prusa Pro Green @SL1S 0.1
    id: ANFB+/a5Szyq/l4HOMdA8w
    values:
      exposure_time: 3.1
      initial_exposure_time: 8
