    id: i7zIvn0vT76DvjIozcVsCQ
    values:
      exposure_time: 3.3
      initial_exposure_time: 25
# 0.1
  - condition: print.layer_height == 0.1
    name: Liqcreate Premium Model @SL1S 0.1
    id: 792MOx7YRRKlr6rBa0hXGg
    values:
      exposure_time: 4.5
      initial_exposure_time: 25
