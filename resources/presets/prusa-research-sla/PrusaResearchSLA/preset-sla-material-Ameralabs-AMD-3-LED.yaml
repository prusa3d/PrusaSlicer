id: Ameralabs AMD 3 LED
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Ameralabs
  material_type: Tough
  material_colour: '#808080'
variants:
## SL1
- condition: printer.model == "SL1"
  id: PcRRt77/TCCigX88Hm4UXg
  unconditional_inherits:
  - '*sl1_fast*'
  variants:
# 0.05
  - condition: print.layer_height == 0.05
    name: Ameralabs AMD 3 LED @SL1 0.05
    id: 08MGn94XSMmw5InCLYGhpg
    values:
      exposure_time: 5
      initial_exposure_time: 30
## SL1S
- condition: printer.model == "SL1S"
  id: SmdlY2ImTDqYV5W4erF4vA
  unconditional_inherits:
  - '*sl1s_fast*'
  variants:
# 0.05
  - condition: print.layer_height == 0.05
    name: Ameralabs AMD 3 LED @SL1S 0.05
    id: 02Fgy/L4RIafgefCRM+idw
    values:
      exposure_time: 1.7
      initial_exposure_time: 24
