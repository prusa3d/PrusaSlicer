id: Prusament Resin Model+ Prusa Orange
kind: sla_material
inherits:
- '*common*'
values:
  material_vendor: Prusa Polymers
  material_type: Model
  material_colour: '#FF8040'
variants:
## SL1S
- condition: printer.model == "SL1S"
  id: 1ciaH0sgQDCyaYnHi73TZQ
  unconditional_inherits:
  - '*sl1s_fast*'
  values:
    area_fill: 20
    tilt_down_initial_speed: [layer1750, layer1750]
    tilt_down_offset_steps: [400, 0]
    tilt_down_finish_speed: [move8000, layer1750]
    tilt_up_initial_speed: [move8000, move8000]
    tilt_up_offset_steps: [600, 600]
    tilt_up_finish_speed: [layer1750, layer1750]
    support_points_density_relative: 250
    material_density: 1.10
  variants:
# 0.025
  - condition: print.layer_height == 0.025
    name: Prusament Resin Model+ Prusa Orange @SL1S 0.025
    id: 5ePIC3mKRQe98LpbPiO6iQ
    values:
      exposure_time: 1.8
      initial_exposure_time: 6
      delay_before_exposure: [4, 20]
# 0.05
  - condition: print.layer_height == 0.05
    name: Prusament Resin Model+ Prusa Orange @SL1S 0.05
    id: kwVB2jQqQ2uxZ+1Ao4tKfQ
    values:
      exposure_time: 2
      initial_exposure_time: 7
      delay_before_exposure: [3, 15]
# 0.1
  - condition: print.layer_height == 0.1
    name: Prusament Resin Model+ Prusa Orange @SL1S 0.1
    id: PGRjXla/TNGOyBbN63H/cw
    values:
      exposure_time: 2.8
      initial_exposure_time: 9
      delay_before_exposure: [1.5, 10]
      support_head_front_diameter: 0.6
      branchingsupport_head_front_diameter: 0.6
      support_head_penetration: 0.5
      branchingsupport_head_penetration: 0.5
