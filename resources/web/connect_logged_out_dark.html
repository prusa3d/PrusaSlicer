<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta content='width=device-width, initial-scale=1.0' name='viewport' />
  <title>Prusa Connect sign in (Dark Mode)</title>
  <style>
    :root {
      --color-background: #141619;
      --color-surface: #1f2226;
      --color-sunken: #191b1f;
      --color-track: #0f1113;
      --color-input: #16181b;
      --color-text: #e7e9ec;
      --color-muted: #9ca4ae;
      --color-placeholder: #6c737d;
      --color-border: #30343a;
      --color-border-strong: #454a52;
      --color-accent: #FA6831;
      --color-accent-hover: #ff7a47;
      --color-accent-text: #ff8b5e;
      --color-accent-soft: rgba(250, 104, 49, 0.14);
      --color-on-accent: #ffffff;
      --color-focus: rgba(250, 104, 49, 0.45);
      --color-error: #ff7b72;
      --color-error-soft: rgba(255, 123, 114, 0.25);
      --color-warn: #f0a24a;
      --color-warn-border: rgba(240, 162, 74, 0.4);
      --color-warn-soft: rgba(240, 162, 74, 0.08);
      --color-shadow: rgba(0, 0, 0, 0.35);
      --color-spool: #d3d3d3;
    }
  </style>
  <link href='connect_pages.css' rel='stylesheet' />
</head>
<body>
<!-- Logged-out page of the Connect tab in online mode (Prusa Connect, signs in to Prusa Account).
     PrusaSlicer fills in the translated texts through connectLoggedOut.init(); the English texts
     stay when it does not. -->
<div class='page'>
  <nav aria-label='Connect service' class='modes' id='modes'>
    <button aria-current='page' data-action='SET_CONNECT_MODE_ONLINE' type='button'>
      <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><path d='M7 18.5h10.5a4 4 0 0 0 .6-7.95 6 6 0 0 0-11.5-1.4A4.7 4.7 0 0 0 7 18.5z' /></svg>
      <span id='mode-cloud'>Prusa Connect</span>
    </button>
    <button data-action='SET_CONNECT_MODE_OFFLINE' type='button'>
      <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><rect height='7' rx='2' width='18' x='3' y='3.5' /><rect height='7' rx='2' width='18' x='3' y='13.5' /><path d='M7 7h.01M7 17h.01M11 7h2M11 17h2' /></svg>
      <span id='mode-local'>Prusa Connect (on-premise)</span>
    </button>
  </nav>

  <main class='card'>
    <div class='brand'>

    </div>
    <svg aria-hidden='true' class='spool-art' viewBox='-250 -250 500 500' xmlns='http://www.w3.org/2000/svg'>
      <defs>
        <pattern class='spool' height='100' id='hexagon' patternTransform='scale(0.875)' patternUnits='userSpaceOnUse'
                 viewBox='-0.866025 -1.5 1.73205 3' width='57.735'>
          <polygon fill='none' points='0,1 0.866025,0.5 0.866025,-0.5 0,-1 -0.866025,-0.5 -0.866025,0.5' stroke-width='0.34' />
          <line stroke-width='0.34' x1='0' x2='0' y1='1' y2='1.5'></line>
          <line stroke-width='0.34' x1='0' x2='0' y1='-1' y2='-1.5'></line>
        </pattern>
      </defs>
      <g class='filament'>
        <circle fill='none' r='145' stroke-width='130'>
          <animate attributeName='r' dur='6s' repeatCount='indefinite' values='145;80;145' />
          <animate attributeName='stroke-width' dur='6s' repeatCount='indefinite' values='130;0;130' />
        </circle>
        <line stroke-width='12' x1='204' x2='204' y1='0' y2='245'>
          <animate attributeName='x1' dur='6s' repeatCount='indefinite' values='204;74;204' />
          <animate attributeName='x2' dur='6s' repeatCount='indefinite' values='204;74;204' />
        </line>
      </g>
      <g class='spool'>
        <circle fill='none' r='157' stroke='url(#hexagon)' stroke-width='171' />
        <circle r='244' stroke-width='12' />
        <circle r='71' stroke-width='18' />
        <animateTransform attributeName='transform' begin='0s' dur='6s' fill='freeze' repeatCount='indefinite'
                          type='rotate' values='0;540;0' />
      </g>
    </svg>
    <h1 id='title'>Sign in to Prusa Connect</h1>
    <p class='lead' id='intro'>Sign in with your Prusa Account to send prints to your printers and see their status here.</p>
    <div class='cta'>
      <button class='btn btn-primary' id='login' type='button'>Sign in</button>
    </div>
  </main>
</div>
<script src='connect_pages.js'></script>
<script src='connect_logged_out.js'></script>
</body>
</html>
