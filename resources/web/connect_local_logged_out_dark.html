<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta content='width=device-width, initial-scale=1.0' name='viewport' />
  <title>Prusa Connect (local) sign in (Dark Mode)</title>
  <style>
    :root {
      --color-background: #141619;
      --color-surface: #1f2226;
      --color-sunken: #191b1f;
      --color-track: #0f1113;
      --color-input: #16181b;
      --color-text: #e7e9ec;
      --color-muted: #9ca4ae;
      --color-placeholder: #6c737d;
      --color-border: #30343a;
      --color-border-strong: #454a52;
      --color-accent: #FA6831;
      --color-accent-hover: #ff7a47;
      --color-accent-text: #ff8b5e;
      --color-accent-soft: rgba(250, 104, 49, 0.14);
      --color-on-accent: #ffffff;
      --color-focus: rgba(250, 104, 49, 0.45);
      --color-error: #ff7b72;
      --color-error-soft: rgba(255, 123, 114, 0.25);
      --color-warn: #f0a24a;
      --color-warn-border: rgba(240, 162, 74, 0.4);
      --color-warn-soft: rgba(240, 162, 74, 0.08);
      --color-shadow: rgba(0, 0, 0, 0.35);
    }
  </style>
  <link href='connect_pages.css' rel='stylesheet' />
</head>
<body>
<!-- Logged-out page of the Connect tab in offline mode (Prusa Connect Local).
     PrusaSlicer fills in the translated texts and the server through connectLocalLoggedOut.init(). -->
<div class='page'>
  <nav aria-label='Connect service' class='modes' id='modes'>
    <button data-action='SET_ACCOUNT_SERVICE_PRUSA_ACCOUNT' type='button'>
      <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><path d='M7 18.5h10.5a4 4 0 0 0 .6-7.95 6 6 0 0 0-11.5-1.4A4.7 4.7 0 0 0 7 18.5z' /></svg>
      <span id='mode-cloud'>Prusa Connect (cloud)</span>
    </button>
    <button aria-current='page' data-action='SET_ACCOUNT_SERVICE_CONNECT_LOCAL' type='button'>
      <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><rect height='7' rx='2' width='18' x='3' y='3.5' /><rect height='7' rx='2' width='18' x='3' y='13.5' /><path d='M7 7h.01M7 17h.01M11 7h2M11 17h2' /></svg>
      <span id='mode-local'>Prusa Connect (local)</span>
    </button>
  </nav>

  <main class='card'>

      <span class='tag' id='mode-tag'>local</span>
    </div>
    <h1 id='title'>Sign in to Prusa Connect</h1>
    <p class='lead' id='intro'>PrusaSlicer will open the sign-in page of your server in a PrusaSlicer window.</p>
    <div class='cta'>
      <button class='btn btn-primary' id='login' type='button'>Sign in</button>
    </div>
    <div class='facts'>
      <div class='fact'>
        <span class='fact-text'>
          <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><rect height='7' rx='2' width='18' x='3' y='3.5' /><rect height='7' rx='2' width='18' x='3' y='13.5' /><path d='M7 7h.01M7 17h.01' /></svg>
          <span id='server'></span>
        </span>
        <button class='link' id='change' type='button'>Change server</button>
      </div>
      <div class='fact hidden' id='trust-row'>
        <span class='fact-text'>
          <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.8' viewBox='0 0 24 24'><rect height='10' rx='2' width='14' x='5' y='11' /><path d='M8 11V8a4 4 0 0 1 8 0v3' /></svg>
          <span class='muted' id='trust'></span>
        </span>
        <button class='link' id='forget' type='button'>Forget certificate</button>
      </div>
    </div>
  </main>
</div>
<script src='connect_pages.js'></script>
<script src='connect_local_logged_out.js'></script>
</body>
</html>
