<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta content='width=device-width, initial-scale=1.0' name='viewport' />
  <title>Slicer</title>
  <style>
       body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        .reload-button {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 15px;
            font-size: 16px;
            color: #e0e0e0;  
            background-color: #333333; 
            border: 1px solid #555555;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .reload-button:hover {
            background-color: #555555;
            color: #ffffff;
        }

        .reload-button:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(100, 100, 100, 0.5);
        }
        .hypertext-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #e0e0e0;
            text-decoration: none;
        }
        
        .hypertext-link:hover {
            text-decoration: underline;
        }
  </style>
</head>
<body>
<!-- This page is not served anywhere, only to be copy 'n' pasted into Slicer as a fallback loading screen. -->
<div id='loading-screen' style='width: 100%; height: 100%'>
  <div style='position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center'>
    <p style="font-size: 24px;">Redirecting to external browser.</p>
  </div>
</div>
<a class="hypertext-link" href="#" onclick="window.PrusaSlicerWebviewMessage.postMessage(JSON.stringify({ event: 'openLoginPage' }))">Sign in using this window</a>
</body>
</html>
