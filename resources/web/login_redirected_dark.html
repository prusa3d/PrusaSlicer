<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta content='width=device-width, initial-scale=1.0' name='viewport' />
  <title>Slicer</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
          background-color: #121212; 
          color: #e0e0e0;           
      }

      .reload-link {
          display: inline-block;
          padding: 10px 18px;
          margin-top: 15px;
          font-size: 16px;
          color: #e0e0e0;  
          background-color: #333333; 
          border: 1px solid #555555;
          border-radius: 5px;
          cursor: pointer;
          text-decoration: none;
          transition: background-color 0.3s ease, color 0.3s ease;
      }

      .reload-link:hover {
          background-color: #555555;
          color: #ffffff;
      }

      .reload-link:focus {
          outline: none;
          box-shadow: 0 0 5px rgba(100, 100, 100, 0.5);
      }
      .hypertext-link {
          position: absolute;
          bottom: 20px;
          right: 20px;
          color: #e0e0e0;
          text-decoration: none;
      }

      .hypertext-link:hover {
          text-decoration: underline;
      }
  </style>
</head>
<body>
<div id='loading-screen' style='width: 100%; height: 100%'>
  <div style='position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center'>
    <p>
      <svg style='width: 80px'
           viewBox='-250 -250 500 500' xmlns='http://www.w3.org/2000/svg'>
        <style type='text/css'>
          .filament {
            stroke: #FA6831; /* Orange - Remains visible */
          }

          .spool {
            stroke: #d3d3d3; /* Light grey - was #231F20 */
            fill: none;
          }

          .filament line {
            stroke-linecap: round;
          }
        </style>
        <defs>
          <pattern class='spool' height='100' id='hexagon' patternTransform='scale(0.875)' patternUnits='userSpaceOnUse'
                   viewBox='-0.866025 -1.5 1.73205 3'
                   width='57.735'
          >
            <polygon fill='none' points='0,1 0.866025,0.5 0.866025,-0.5 0,-1 -0.866025,-0.5 -0.866025,0.5'
                     stroke-width='0.34' />
            <line stroke-width='0.34' x1='0' x2='0' y1='1' y2='1.5'></line>
            <line stroke-width='0.34' x1='0' x2='0' y1='-1' y2='-1.5'></line>
          </pattern>
        </defs>
        <g class='filament'>
          <circle fill='none' r='145' stroke-width='130'>
            </circle>
          <line stroke-width='12' x1='204' x2='204' y1='0' y2='245'>
            </line>
        </g>
        <g class='spool'>
          <circle fill='none' r='157' stroke='url(#hexagon)' stroke-width='171' />
          <circle r='244' stroke-width='12' />
          <circle r='71' stroke-width='18' />
          </g>
      </svg>
    </p>
    <p style="font-size: 24px;">Please, sign in using external browser.</p>
    <a href="#" class="reload-link" onclick="window.PrusaSlicerWebviewMessage.postMessage(JSON.stringify({ event: 'reopenLogInBrowser' })); return false;">Reopen external browser</a>
  </div>
</div>
<a class="hypertext-link" href="#" onclick="window.PrusaSlicerWebviewMessage.postMessage(JSON.stringify({ event: 'openLoginPage' }))">Use this window to sign in</a>
</body>
</html>
